name: Build Quake3e iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quake3e-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Validate build scripts
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          ! grep -R 'VkRasterizationStateCreateInfo' patches/0031-a13-vulkan-pipeline-diagnostics.patch
          grep -q 'VkPipelineRasterizationStateCreateInfo' patches/0031-a13-vulkan-pipeline-diagnostics.patch

      - name: Verify Intel runner architecture
        run: |
          test "$(uname -m)" = "x86_64"
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache pinned engine checkout
        uses: actions/cache@v4
        with:
          path: vendor/Quake3e
          key: quake3e-${{ hashFiles('upstream.pin') }}

      - name: Cache MoltenVK iOS framework
        uses: actions/cache@v4
        with:
          path: vendor/moltenvk-ios
          key: moltenvk-ios-1.4.2

      - name: Cache iOS dependencies
        uses: actions/cache@v4
        with:
          path: build/ios-deps
          key: ios-deps-curl-8.11.1-xcode26-iphoneos16

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ios-engine-${{ hashFiles('upstream.pin', 'patches/*.patch', 'scripts/build-ios.sh') }}
          restore-keys: |
            ccache-ios-engine-

      - name: Fetch pinned Quake3e engine
        run: |
          set -euo pipefail
          mkdir -p vendor
                    ENGINE_COMMIT="$(awk '$1 == "commit" {print $3}' upstream.pin)"
          if [ -d vendor/Quake3e/.git ]; then
            git -C vendor/Quake3e checkout "$ENGINE_COMMIT"
          else
            git clone --filter=blob:none https://github.com/ec-/Quake3e vendor/Quake3e
            git -C vendor/Quake3e checkout "$ENGINE_COMMIT"
          fi
          test "$(git -C vendor/Quake3e rev-parse HEAD)" = "$ENGINE_COMMIT"

      - name: Validate engine patch series before installing/building
        run: bash scripts/sync-overlay.sh

      - name: Install build tools (no Homebrew update)
        run: |
          brew install xcodegen molten-vk vulkan-loader ccache
          ccache -M 1G
          ccache -s

      - name: Fetch MoltenVK 1.4.2 for iOS
        run: bash scripts/fetch-moltenvk-ios.sh

      - name: Build native Vulkan reference and iOS dependencies
        run: |
          bash scripts/build-oracle.sh
          bash scripts/build-ios-deps.sh

      - name: Build unsigned iOS app
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: bash scripts/build-ios.sh

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/ios/xcode/Release-iphoneos/Quake3e.app"
          test -d "$APP"
          mkdir -p ipa/Payload
          /usr/bin/ditto "$APP" ipa/Payload/Quake3e.app
          (cd ipa && /usr/bin/zip -qry ../Quake3e.ipa Payload)
          test -s Quake3e.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ipa/Payload/Quake3e.app/Info.plist
          unzip -t Quake3e.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Quake3e-build
          path: Quake3e.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct IPA release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Quake3e iOS #${{ github.run_number }}
          prerelease: false
          files: Quake3e.ipa
          fail_on_unmatched_files: true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quake3e-build-logs
          path: |
            build/oracle-*-make.log
            build/ios/xcodebuild.log
            build/ios-deps/curl-configure.log
            build/ios-deps/curl-make.log
            build/ios-deps/src/curl-*/config.log
          if-no-files-found: ignore
          retention-days: 7
